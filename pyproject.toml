[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phyto-reason-agent"
version = "5.0.0"
description = "PhytoReason-Agent — 多物种药用植物次生代谢调控科研推理 Agent"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["medicinal plants", "secondary metabolism", "transcription factor", "bioinformatics", "hypothesis reasoning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "click>=8.0",
    "fastapi>=0.100",
    "python-multipart>=0.0.9",
    "uvicorn>=0.20",
    "pydantic>=2.0",
    "langgraph>=0.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "tenacity>=8.2",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
desktop = ["PySide6>=6.6"]
ms2 = ["pyteomics>=4.5"]   # mzML 解析（MGF/CSV 无需任何额外依赖）
tfpred = ["pyhmmer>=0.11"]  # 转录因子 HMM 预测   # mzML 解析（MGF/CSV 无需任何额外依赖）

[project.scripts]
plantomics = "phyto_reason.agents.cli:main"
plantomics-desktop = "phyto_reason.desktop.client:run"

[tool.setuptools.packages.find]
include = ["phyto_reason*"]

[tool.pytest.ini_options]
testpaths = ["phyto_reason/tests"]
# 用户 Temp 下 pytest-of-* 目录曾在损坏 ACL 后无法清理，统一用仓库内临时目录
addopts = "--basetemp=.pytest_tmp"
